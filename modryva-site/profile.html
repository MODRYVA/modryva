<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MODRYVA — Account</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>
  <main class="profile-page">
    <section class="login-card account-card">
      <button class="close-button" type="button" onclick="location.href='index.html'" aria-label="Close">×</button>
      <div class="account-brand">
        <img src="assets/logo.png" alt="MODRYVA logo" width="48" height="48" />
        <span>MODRYVA</span>
      </div>

      <div id="account-signed-out">
        <h1 data-account-title>Создать аккаунт</h1>
        <p class="account-lead" data-account-lead>Сначала выбери Google-аккаунт. Затем создашь отдельный пароль для MODRYVA.</p>

        <button class="google-auth-button" id="google-auth" type="button">
          <span class="google-g">G</span>
          <span data-google-label>Продолжить с Google</span>
        </button>

        <div class="account-divider"><span>или</span></div>

        <form id="password-login-form" class="login-row" hidden>
          <label class="account-label" for="login-email">Почта</label>
          <input id="login-email" class="login-input" type="email" autocomplete="email" required placeholder="name@example.com" />
          <label class="account-label" for="login-password">Пароль MODRYVA</label>
          <input id="login-password" class="login-input" type="password" autocomplete="current-password" required minlength="8" placeholder="••••••••" />
          <button class="login-button full-button" type="submit">Войти →</button>
        </form>

        <button id="account-mode-switch" class="account-switch" type="button">Уже есть аккаунт? Войти по почте и паролю</button>
        <p class="login-help">При регистрации Google подтверждает твою почту, а пароль MODRYVA создаётся уже после выбора аккаунта.</p>
      </div>

      <div id="account-signed-in" hidden>
        <h1>Аккаунт</h1>
        <p class="account-lead">Ты уже вошёл в MODRYVA.</p>
        <div class="account-info-box">
          <strong id="signed-in-email"></strong>
        </div>
        <div class="account-actions-grid">
          <a class="primary-button" href="inbox.html">Входящие</a>
          <a class="secondary-button" href="support.html">Поддержка</a>
          <a class="secondary-button" id="admin-link" href="admin.html" hidden>Панель MODRYVA</a>
          <button class="secondary-button account-switch-button" id="switch-account-button" type="button">Сменить аккаунт</button>
          <button class="danger-button" id="logout-button" type="button">Выйти</button>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=6"></script>
  <script src="app.js?v=22"></script>
</body>
</html>
