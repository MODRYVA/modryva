<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MODRYVA — Account</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="profile-page">
    <section class="login-card account-card">
      <button class="close-button" type="button" onclick="location.href='index.html'" aria-label="Close">×</button>
      <div class="account-brand">
        <img src="assets/logo.png" alt="MODRYVA logo" />
        <span>MODRYVA</span>
      </div>
      <h1 data-account-title>Создать аккаунт</h1>
      <p class="account-lead" data-account-lead>Аккаунт нужен, чтобы отправлять заказы, получать ответы и скачивать готовые .jar прямо на сайте.</p>

      <form id="profile-form" class="login-row">
        <label class="account-label" for="account-email" data-i18n="accountEmailLabel">Почта</label>
        <input id="account-email" class="login-input" type="email" autocomplete="email" required placeholder="name@example.com" />
        <div class="login-actions">
          <button class="login-button" type="submit"><span data-account-submit>Создать аккаунт</span> →</button>
        </div>
      </form>

      <button id="account-mode-switch" class="account-switch" type="button">Уже есть аккаунт? Войти</button>
      <p class="login-help">Сейчас включён тестовый вход по e-mail без пароля. Настоящую регистрацию и защищённые аккаунты подключим следующим шагом через backend.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
