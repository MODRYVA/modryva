<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MODRYVA — Inbox</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <main class="inner-page">
    <section class="inner-card inbox-card">
      <header class="inner-header">
        <a class="brand" href="index.html"><img src="assets/logo.png" alt="MODRYVA logo"><span>MODRYVA</span></a>
        <div class="header-links">
          <a class="back-link" href="support.html">Поддержка</a>
          <a class="back-link" href="index.html" data-i18n="back">← На главную</a>
        </div>
      </header>
      <div class="inner-body">
        <div class="inbox-heading">
          <div>
            <h1 data-i18n="inboxTitle">Входящие</h1>
            <p class="lead" data-i18n="inboxLead">Здесь твои заказы, ответы MODRYVA и готовые файлы .jar.</p>
          </div>
          <span class="account-chip" id="account-chip"></span>
        </div>

        <div class="inbox-layout">
          <aside>
            <div id="orders-list" class="orders-list"></div>
            <div class="empty-mini" id="empty-inbox" hidden>
              <p>Заказов пока нет.</p>
              <a class="primary-button" href="order.html">Создать заказ</a>
            </div>
          </aside>
          <section class="conversation-panel" id="order-detail">
            <div class="conversation-placeholder">Выбери заказ слева, чтобы открыть переписку.</div>
          </section>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
